author: anonym user
date: '2010-11-24 17:32:00'
rating: 5
body: >-
  This is simply the best restaurant my wife and I have eaten in. Without a
  doubt, it has a wonderful atmosphere, the most gracious and attentive staff,
  relaxing and enjoyable ambiance, and absolutely the most wonderful food we
  have eaten. We have eaten at Great Taste several times in a week, we enjoy it
  and the staff so much. We recommend Great Taste to all who enjoy a wonderful,
  relaxing dining experience filled with the best in Chinese cuisine. Be sure to
  visit, and you will be sure to return over and over again. Enjoy!

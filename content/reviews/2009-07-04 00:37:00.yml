author: Angela Read
date: '2009-07-04 00:37:00'
rating: 5
body: >-
  Great Taste Chinese Restaurant has the highest quality of food I have ever
  eaten at a chinese restaurant. On my first visit I was surprised at its
  cleanliness, presentation and quality, that it is now the ONLY chinese
  restaurant I order from and visit. Their food quality is consistent and fresh.
  What a great find in New Britain, CT! Thank You. New Britain Residen

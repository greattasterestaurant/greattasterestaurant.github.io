author: Elaine Mennillo
date: '2012-03-08 18:22:00'
rating: 5
body: >-
  This is by far my favorite Chinese food. The Tangerine beef is out of this
  world. I recommend that anyone visiting New Britain or the surrounding towns
  to stop in and enjoy the wonderful cuisine. Service is outstanding. Your water
  glass is filled constantly. No waiting. This out classes any other restaurant
  in chinese food by far. Class restaurant all the way

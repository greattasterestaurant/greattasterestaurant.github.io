author: Jason
date: '2010-10-21 00:05:00'
rating: 5
body: >-
  Great taste has the best chinese food in the state. Not only is the food
  great, but so too is the atmosphere. I bring my girlfriend and we enjoy a
  couple of drinks and a dinner special (Mt. Fuji is a favorite) and feel like
  we are treated like royalty. I would recommend to anyone

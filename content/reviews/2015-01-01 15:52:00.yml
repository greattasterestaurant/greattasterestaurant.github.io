rating: 1
body: >-
  GREAT TASTE was always one of my favorites. keyword was... they must have
  changed ownership,service was unacceptable,food so so, not anywhere near the
  quality I was used to.What a disappointment,had company from out of town,they
  were understaffed, waiters had a 'could care less attitude' party of 10,food
  came out in 3 different servings,and lukewarm,cocktails took 30 min. to get to
  us,second round came after the food,it was certainly not the 'GREAT TASTE' I
  was used to. Had to appologize to my guests for wanting to go there

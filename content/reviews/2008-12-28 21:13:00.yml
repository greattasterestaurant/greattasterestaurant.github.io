author: Gerry
date: '2008-12-28 21:13:00'
rating: 5
body: >-
  We are friends of Terri Guay and Fr. Ray Proulx. We have been to your
  restaurant on many occasions and have always had a wonderful meal. We have
  always been treated like royalty when we are with Terri and Fr. Ray. Our only
  complaint is that you don't have a restaurant closer to Waterbury. We would
  probably be there weekly. I just love the decorations that are made with the
  vegetables

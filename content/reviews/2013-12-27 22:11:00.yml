author: Jean & Ruth
date: '2013-12-27 22:11:00'
rating: 5
body: >-
  I've lived in California, and when I started eating at Great Taste, I found
  the food to be much better than anything I'd ever had. Most Chinese
  restaurants use a lot of salt in one form or another on their dishes. Great
  Taste serves good, wholesome food that is not laden with additives and salt.
  We've been patrons of Great Taste for over 10 years, and don't ever think of
  going elswhere

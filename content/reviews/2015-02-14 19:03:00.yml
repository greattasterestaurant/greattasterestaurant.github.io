author: John Zajac
date: '2015-02-14 19:03:00'
rating: 5
body: >-
  Outstanding service. Excellent food. Great value. After numerous visits, I
  have never been disappointed. John always greets us and makes us feel welcome.
  Derrick is the one of the best waiters that has ever sever us, he makes guests
  feel like they are at a five star restaurant in New York or Las Vegas. Great
  selection of appetizers, cold sesame noodles and chicken song are exceptional.
  On each visit we try a different entree, each was of the highest quality
  ingredients and excellently prepared. Definitely a destination restaurant

author: Sam Chester
date: '2011-01-11 14:13:00'
rating: 5
body: >-
  I just love dining at Great Taste. The whole experience is first class in
  every way. The cocktails are generous and well made. The food is beautifully
  and creatively prepared with the freshest of ingredients. The service is
  always prompt and professional. One is always made to feel very welcome here.
  Frank Kwok, the owner, is a great host and wonderful person. The atmosphere is
  tasteful with beautiful chandeliers and an elegantly set table awaiting you.
  The restaurant, to me, is as good as if not better than Shun Lee Palace in New
  york City where we often dine. I will return here time and time again

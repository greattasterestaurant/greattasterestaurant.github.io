author: sam
date: '2014-12-12 22:11:00'
rating: 5
body: >-
  Great Taste is a fantastic restaurant. I am always greeted with a warm smile
  and quickly ushered to an incredibly clean, beautifully appointed table. Right
  away I am put at ease by a very comfortable atmosphere and a very attentive
  staff. It is not obnoxiosly loud (like many other restaurants with competing
  stereo systems and TV's), instead it is very calming and very relaxing. You
  are quickly brought ice water and hot tea, along with egg noodles and sweet or
  hot dipping sauces. Choosing from the menu is always difficult for me because
  everything looks so good. Some good choices to try are 'Mount Fuji', which
  includes beef, chicken, pork, and seafood in a wonderful sauce... or 'Dragon
  Meets Phoenix'... a beautiful dish of General Tsao's chicken with Jumbo Shrimp
  and assorted vegetables. This restaurant continues to get it right, providing
  all the elements I expect from a top notch restaurant: Atmosphere, Attentive
  Staff, Value, and incredible food taste/quality. I highly recommend Great
  Taste..

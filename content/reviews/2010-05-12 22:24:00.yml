author: Cree Kelly
date: '2010-05-12 22:24:00'
rating: 5
body: >-
  My family has been going to the Great Taste ever since they opened and now
  that most of us have moved away, we still make an effort to get there anytime
  we are in the area. This restaurant has been consistent over the years at
  being one of the best Chinese restaurants you will find anywhere. New Britain
  has changed dramatically over the years while this restaurant has not. Unless
  you have family or a doctor there, you may be hard pressed to think of a
  reason to stop there, unless of course you are going to the Great Taste where
  you will never be disappointed. Trust me, the restaurant's name says it all

author: john
date: '2014-10-19 04:00:00'
rating: 4
body: >-
  i have to say... this is hands down the best chinese food in ct! i cant say
  its the best ive ever eaten, but it is pretty close! the prices are a little
  steep for what your getting! the best chinese food in my opinion comes from
  new york. but being a ct resident ive yet to be dissapointed. i have tried
  many dishes on the menu and i highly recomend the tangerine beef as well as
  the singapore chow mein fun. the location definatly brings this place down.
  they dont deliver but i think that makes them look classy bc this is a sit
  down restaraunt and very fancy looking on the inside with very friendly staff
  forcing you to come to them and well worth the trip. the genersl tso's chicken
  is pretty decent as well and the kung pao chicken is excellent some of the
  best ive tried which is a dish i will only order fom very few places being the
  fact that a lot of places dont make it correctly!!!!! its my opinion that any
  negative feedback this place recieves is most likly comeing from a harsh
  critic who wants to find something wrong with them but who knows everyone is
  entitled to express their feelings about their experience. i eat here on a
  regular basis and will continue to do so until a day comes that i find myself
  dissapointe

author: Joe Rivera
date: '2011-10-20 15:02:00'
rating: 5
body: >-
  I go to this restaurant on special occassions. I've gone for birthdays and for
  my own anniversary. I love the atmosphere and the food is the best chinese
  food I have ever had. The prices are fair and the quality cannot be beat. The
  staff is friendly and very knowledgeable of their menu. The food always comes
  out promptly and best of all hot and delicious. I would recommend this
  restaurant to everyone

author: Maureen Burns
date: '2014-04-06 21:18:00'
rating: 1
body: >-
  Maureen. I had the Great Taste Lobster which was Loster boiled and chopped to
  bits and chunks. Over pasta and beef with beef sauce flowing over it all. It
  was the Messiest thing I ever ate. You couldn't even hold the lobster . to
  crack it because it was dripping with beef juice all over you. NO GREAT TASTE
  HERE

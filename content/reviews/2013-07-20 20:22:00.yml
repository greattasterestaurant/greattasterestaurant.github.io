author: Bell K.
date: '2013-07-20 20:22:00'
rating: 5
body: >-
  The lunch specials are very reasonable. I had the tangerine beef and it was by
  far the best I have ever tasted!! The wait staff served us right away and were
  very attentive. My husband enjoyed his egg drop soup and General Tao chicken.
  There were lots of leftovers (they give generous portions) but the hot weather
  prevented us from taking them as we had a couple other stops. We were very
  happy with our experience

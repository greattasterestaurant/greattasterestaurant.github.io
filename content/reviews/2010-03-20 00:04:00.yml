author: anonym user
date: '2010-03-20 00:04:00'
rating: 1
body: >-
  I've been dining at Great Taste for a few years and have always wondered what
  all the fuss was about. I have never been that impressed other than the
  atmosphere when dining in the resaurant. I've ordered take out many times and
  2 years ago was the last time because the Orange Chicken dish I ordered was
  barely edible because of all the orange rind. I've had Orange Chicken at other
  establishments in other states and know what to expect when ordering it.
  Tonight I thought I'd give Great Taste another try. I ordered Jumbo Shrimp
  with Szechuan this time. Again, I am very familiar with what to expect when
  ordering Szechaun style dishes. What I was served from Great Taste was NOTHING
  like any other Szechaun dish I've ever had. The sauce was red, hardly any heat
  at all and no where to be found the chopped hot peppers I've found in any
  other Szechuan dish. The meal was also overwhelmed with diced onions. All I
  can assume is the people in Connecticut have never had really good Chinese
  food, otherwise Great Taste would have been out of business long ago. I don't
  think there is any value for your money at all. If the food were even near
  being good I wouldn't mind paying their prices but it just isn't. Suffice it
  to say, I will not try them again. I'm finished with being disappointed every
  time

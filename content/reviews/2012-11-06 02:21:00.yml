author: Mary
date: '2012-11-06 02:21:00'
rating: 1
body: >-
  First i wanna start off saying that the food was ok for the price you pay.
  They have a small bar area where you can actually see the waitors touching
  your garnishes like we didn't exisits. The drinks was not as good as i thought
  it was. I ordered a Mai Tai and they didn't even give me grenadine. The Mai
  Tai was horrible. NOT EVEN KIDDING. I told the waitress to replace my drink
  and she walked away like she didn't even hear me. Their service was
  disgusting. My waitress brought the food over and she never came back to even
  ask if i needed anything. Oh did i mention that she coundn't even speak
  English correctly. First time in Great taste and also my last time. This
  restaurant does not deserve any credit at all. -Mar

author: DENNISPS78
date: '2008-08-29 23:45:00'
rating: 5
body: >-
  Great Taste is by far the best Chinese restaurant my wife and I have ever
  dines in. The service is first class, the menu is varied and extensive. The
  waitstaff is very knowledgeable and friendly. An added bonus is the
  availability of many nutritious and healthy meal choices. An overall very
  enjoyable dining experience.

author: anonym user
date: '2015-01-11 05:11:00'
rating: 5
body: >-
  Great Taste continues to be my favorite Chinese restaurant and restaurant in
  general.. Whether I am dining in or taking out, I am always treated so
  respectfully and with a smile. John is always there to great me when I walk in
  and really knows how to make me feel at home. The food is out of this world
  and for the quality - an amazing price. Thank you for never disappointing. I
  will continue being a customer and recommending you to all my family and
  friends. Wish you guys the best

author: Diane
date: '2014-12-29 19:34:00'
rating: 1
body: >-
  HORRIBLE service! We'll never go to this restaurant again! I made a
  reservation two weeks early, requesting the back room for 12. When we showed
  up on time, we were told our table was just given away and we could wait 30
  minutes for them to "rush" another party out of the room. So ... we sat
  crammed together at a table in the dining room where we had water spilled on
  one of the guests, water spilled all over the table when they dropped a plate,
  and had tongs hit us when they lost control of them. It took over 20 minutes
  for a waiter to acknowledge we were even there. The drinks and food were all
  delayed, and half the food came out 15 minutes later than the first half --
  barely warm. We spoke to the manager who offered no help whatsoever. All in
  all, a terrible experience we'll never repeat. P.S. I only picked one star
  because I had to, to save this review. They earned ZERO stars

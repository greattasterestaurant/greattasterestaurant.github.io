author: Mary Susco
date: '2010-03-08 01:37:00'
rating: 5
body: >-
  I was out with relatives for my Aunt's 92nd birthday tonight. I have been by
  your restaurant many times but never stopped in. What a treat. I was very
  happy with my meal and your staff was very attentive to all of our needs. It
  was truly a pleasure. I will be back and I will tell my friends about my
  wonderful experience at your establishment. Sincerely, Mary Susc

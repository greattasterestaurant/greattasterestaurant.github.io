author: Nicole
date: '2009-06-25 21:05:00'
rating: 5
body: >-
  My husband and I have been going here since we were dating...we had our first
  date here back in 2001. We love the food whether your dining in or ordering to
  go, the service is always great. We have tried many chinese restaurants and
  Great Taste knocks them all out of the park...no one compares to the quality
  of food they provide to their customers. Each dish is beautiful..you can tell
  that the cook staff takes the time to make every dish just right from its
  appearance to the taste. The entire staff always has a smile on their face
  from the moment you walk in by saying hello and making sure to say good bye as
  you walk out the door. This family fun business unlike any other...customer
  service is definitely #1. Congrats to Great Taste for a job well done!
  Sincerely, Nicole B

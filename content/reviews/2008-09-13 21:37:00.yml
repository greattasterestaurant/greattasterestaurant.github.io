author: johnfan
date: '2008-09-13 21:37:00'
rating: 5
body: >-
  We have been loyal customers of Great Taste since 1988. We love it! Whenever
  we want to take someone out to dinner we always choose Great Taste because we
  know we will never be disappointed. The service and food are impeccable.
  Whenever we go there we are treated like family! May of the same waiters have
  been there all these years and many are requested by name especially John, who
  brings service to an exceptionally high level. He greets us by our first names
  whenever we walk in. We hope to remain customers for another 25+ years

author: Theresa
date: '2014-03-07 23:49:00'
rating: 5
body: >-
  I am a life long resident of New Britain and have enjoyed the food and service
  at Great Taste for over 25 years. Great Taste is New Britain's jewel. The food
  and service is top notch. From the moment you walk in the door it is a great
  dining experience

author: G.
date: '2014-03-08 20:28:00'
rating: 5
body: >-
  March 8, 2014 Dear Great Taste: I just wanted to comment about your food. I
  recommended you to a coworker of mine. The daughter in law of my coworker was
  born and raised in China. She stated that your food was the closest to what
  you can get in China. Your food was very authentic and very good. In my
  experience, the worst order I have ever received from you was at least a
  hundred times better than any other Chinese food I have tasted. You are the
  Best! G
